  codegen:
    name: Generated SDK (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: g++
            mode: release
          - compiler: clang++-18
            mode: sanitized
    steps:
      - uses: actions/checkout@v4
      - name: Bound host package downloads
        uses: ./.github/actions/setup-apt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned TypeScript
        run: npm install --prefix "$RUNNER_TEMP/codegen-tools" typescript@5.9.3 --no-audit --no-fund
      - name: Install selected host compiler and example tools
        shell: bash
        run: |
          packages=(ninja-build)
          if [[ '${{ matrix.compiler }}' == 'clang++-18' ]]; then packages+=(clang-18); fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
      - name: Install the project's Qt
        uses: ./.github/actions/setup-qt
      - name: Install offline ARM and browser tools
        if: matrix.mode == 'release'
        run: |
          # Linked codec roots explicitly use -nostdlib, -lgcc, -lc and -lnosys.
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-dev
          python3 -m venv "$RUNNER_TEMP/codegen-browser"
          "$RUNNER_TEMP/codegen-browser/bin/pip" install playwright==1.63.0
          "$RUNNER_TEMP/codegen-browser/bin/python" -m playwright install --with-deps chromium
      - name: Execute generated C++ and JS/TS through both API paths
        run: |
          options=()
          if [ '${{ matrix.mode }}' = sanitized ]; then options+=(--sanitize); fi
          if [ '${{ matrix.mode }}' = release ]; then
            options+=(--arm-cxx arm-none-eabi-g++ --browser-python "$RUNNER_TEMP/codegen-browser/bin/python")
          fi
          python3 tests/codegen/run.py --cxx '${{ matrix.compiler }}' \
            --node node --tsc "$RUNNER_TEMP/codegen-tools/node_modules/typescript/bin/tsc" \
            --build-dir "$RUNNER_TEMP/codegen-${{ matrix.mode }}" "${options[@]}"
      - name: Optional C++ wire editing and failure atomicity
        run: |
          options=()
          if [ '${{ matrix.mode }}' = sanitized ]; then options+=(--sanitize); fi
          python3 -B tests/cpp_wire_editing/run.py --cxx '${{ matrix.compiler }}' \
            --build-dir "$RUNNER_TEMP/cpp-wire-editing-${{ matrix.mode }}" "${options[@]}"
      - name: Build and execute separate CMake and qmake consumers
        if: matrix.mode == 'release'
        run: |
          cmake -S examples/codegen_cpp -B "$RUNNER_TEMP/codegen-cmake" -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/codegen-cmake" -j2
          ctest --test-dir "$RUNNER_TEMP/codegen-cmake" --output-on-failure
          mkdir -p "$RUNNER_TEMP/codegen-qmake"
          cd "$RUNNER_TEMP/codegen-qmake"
          qmake "$GITHUB_WORKSPACE/examples/codegen_cpp/codegen_cpp.pro" CODEGEN_SDK="$RUNNER_TEMP/codegen-cmake/generated"
          make -j2
          ./codegen_cpp
      - name: Optional structural metadata through standalone consumers
        run: |
          options=()
          if [ '${{ matrix.mode }}' = sanitized ]; then options+=(--sanitize); fi
          if [ '${{ matrix.mode }}' = release ]; then options+=(--arm-cxx arm-none-eabi-g++); fi
          python3 -B tests/sdk_metadata/run.py --cxx '${{ matrix.compiler }}' \
            --node node --tsc "$RUNNER_TEMP/codegen-tools/node_modules/typescript/bin/tsc" \
            --build-dir "$RUNNER_TEMP/sdk-metadata-${{ matrix.mode }}" "${options[@]}"
      - name: Four-surface installed SDK conformance
        run: |
          options=()
          if [ '${{ matrix.mode }}' = sanitized ]; then options+=(--sanitize); fi
          python3 -B tests/sdk_conformance/run.py --cxx '${{ matrix.compiler }}' \
            --node node --tsc "$RUNNER_TEMP/codegen-tools/node_modules/typescript/bin/tsc" \
            --build-dir "$RUNNER_TEMP/sdk-conformance-${{ matrix.mode }}" "${options[@]}"
      - name: Check out the versioned optional UX generator
        if: matrix.mode == 'release'
        uses: actions/checkout@v4
        with:
          repository: shpegun60/telemetry-ux
          ref: 1f6856b8a7cb8a7e67d4807d29a26fa326bacf2b
          path: .ci/telemetry-ux
      - name: Relocated CMake, packed ESM and installed Python consumers
        if: matrix.mode == 'release'
        run: |
          python3 -m venv "$RUNNER_TEMP/sdk-package-tools"
          "$RUNNER_TEMP/sdk-package-tools/bin/pip" install setuptools==80.9.0 wheel==0.45.1
          "$RUNNER_TEMP/sdk-package-tools/bin/python" -B tests/sdk_packages/run.py \
            --node node --tsc "$RUNNER_TEMP/codegen-tools/node_modules/typescript/bin/tsc" \
            --build-dir "$RUNNER_TEMP/sdk-packages"
      - name: Installed core, optional UX and complete distribution ownership
        if: matrix.mode == 'release'
        run: |
          "$RUNNER_TEMP/sdk-package-tools/bin/python" -B tests/ux_codegen_extension/run.py \
            --ux-root .ci/telemetry-ux --build-dir "$RUNNER_TEMP/ux-codegen-extension"
      - name: Retain generated SDK qualification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codegen-${{ matrix.mode }}
          path: |
            ${{ runner.temp }}/codegen-${{ matrix.mode }}/*.json
            ${{ runner.temp }}/codegen-${{ matrix.mode }}/*.log
            ${{ runner.temp }}/codegen-${{ matrix.mode }}/*.su
            ${{ runner.temp }}/codegen-${{ matrix.mode }}/*.elf
            ${{ runner.temp }}/codegen-${{ matrix.mode }}/generated/manifest.json
            ${{ runner.temp }}/codegen-${{ matrix.mode }}/native/descriptor.bin
            ${{ runner.temp }}/cpp-wire-editing-${{ matrix.mode }}/
            ${{ runner.temp }}/sdk-metadata-${{ matrix.mode }}/
            ${{ runner.temp }}/sdk-conformance-${{ matrix.mode }}/
            ${{ runner.temp }}/sdk-packages/*.json
            ${{ runner.temp }}/sdk-packages/*.log
            ${{ runner.temp }}/ux-codegen-extension/*.json
            ${{ runner.temp }}/ux-codegen-extension/*.log
          if-no-files-found: ignore
  arm:
    name: Cortex-M7 compile and link
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Authenticate sealed hardware and recorded-source Git snapshots.
      - name: Bound host package downloads
        uses: ./.github/actions/setup-apt
      - name: Install ARM GCC and newlib-nano
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
      - name: Shared Cortex-M7 ID and slot checks
        run: |
          python3 tests/h7s_support/check.py
          python3 tests/run_arm_checks.py --build-dir build/arm
          python3 tests/run_arm_checks.py --null-checks --build-dir build/arm-null
          python3 tests/regression/ArmSlotGateCheck.py --build-dir build/arm
          python3 tests/regression/ArmSlotGateCheck.py --build-dir build/arm-null
      - name: C++20 resource Cortex-M7 checks
        run: python3 tests/resources/run.py --arm --cxx arm-none-eabi-g++ --build-dir build/arm-resources
      - name: Bounded scalability layout and visitor objects
        run: |
          python3 tests/scalability/runtime.py --arm --cxx arm-none-eabi-g++ --build-dir "$RUNNER_TEMP/scalability-arm/layout"
          python3 tests/scalability/visitors.py --arm --cxx arm-none-eabi-g++ --rows 128 --build-dir "$RUNNER_TEMP/scalability-arm/visitors"
