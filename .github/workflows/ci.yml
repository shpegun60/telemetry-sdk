  endian:
    name: Real little/big endian byte equivalence
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Bound host package downloads
        uses: ./.github/actions/setup-apt
      - uses: actions/checkout@v4
        with:
          repository: shpegun60/cobs
          ref: 2e0abf260848fcb74e4a57b37532188047759643
          path: build/dependencies/cobs
      - name: Install s390x C++ compiler and user-mode emulator
        run: sudo apt-get update && sudo apt-get install -y g++-s390x-linux-gnu qemu-user cmake ninja-build
      - name: Canonical codec, resource client, Descriptor and Values bytes
        run: python3 tests/structured/codec/endian.py --build-dir build/endian
      - name: Generated standalone codec on real little and big endian
        run: python3 tests/codegen/endian.py --build-dir "$RUNNER_TEMP/codegen-endian"
      - name: Runtime reader and transactional writer on real little and big endian
        run: python3 -B tests/runtime_schema/run.py --big-endian --build-dir "$RUNNER_TEMP/runtime-endian"
      - name: Production ReadMany on the big-endian s390x target
        run: |
          python3 -B tests/read_many/run.py --cxx s390x-linux-gnu-g++ \
            --emulator qemu-s390x --sysroot /usr/s390x-linux-gnu \
            --build-dir "$RUNNER_TEMP/read-many-endian"
      - name: COBS telemetry/resource on a real big-endian target
        run: python3 tests/cobs/run.py --cxx s390x-linux-gnu-g++ --emulator qemu-s390x --sysroot /usr/s390x-linux-gnu --expect-big-endian --cobs-root build/dependencies/cobs --build-dir build/cobs-big
      - name: Retain endian execution and byte equivalence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: little-big-endian
          path: |
            build/endian/
            ${{ runner.temp }}/codegen-endian/
            ${{ runner.temp }}/runtime-endian/
            ${{ runner.temp }}/read-many-endian/
            build/cobs-big/
          if-no-files-found: error

  qml-codegen:
    name: Generated Qt QML SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Bound host package downloads
        uses: ./.github/actions/setup-apt
      - name: Check out the versioned optional UX generator
        uses: actions/checkout@v4
        with:
          repository: shpegun60/telemetry-ux
          ref: 238a96efbf3f29e6f0546d1231a19ba03a240c2e
          path: .ci/telemetry-ux
      - name: Install current core and pinned UX generator wheels outside checkouts
        run: |
          python3 -m venv "$RUNNER_TEMP/ux-generator-tools"
          "$RUNNER_TEMP/ux-generator-tools/bin/pip" install setuptools==80.9.0 wheel==0.45.1
          mkdir -p "$RUNNER_TEMP/ux-generator-core-source" "$RUNNER_TEMP/ux-generator-ux-source" "$RUNNER_TEMP/ux-generator-wheels"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/ux-generator-core-source"
          git -C .ci/telemetry-ux archive HEAD | tar -x -C "$RUNNER_TEMP/ux-generator-ux-source"
          "$RUNNER_TEMP/ux-generator-tools/bin/pip" wheel --no-deps --no-index --no-build-isolation \
            --wheel-dir "$RUNNER_TEMP/ux-generator-wheels" \
            "$RUNNER_TEMP/ux-generator-core-source" "$RUNNER_TEMP/ux-generator-ux-source"
          version="$(tr -d '\r\n' < VERSION)"
          "$RUNNER_TEMP/ux-generator-tools/bin/pip" install --no-index --find-links "$RUNNER_TEMP/ux-generator-wheels" \
            "telemetry-codegen-core==$version" "telemetry-ux-codegen==$version"
      - name: Install the host compiler and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 cmake ninja-build
      - name: Install the project's Qt with SerialPort
        uses: ./.github/actions/setup-qt
        with:
          modules: qtserialport
      - name: Check out the qualified COBS transport
        uses: actions/checkout@v4
        with:
          repository: shpegun60/cobs
          ref: 2e0abf260848fcb74e4a57b37532188047759643
          path: build/dependencies/cobs
      - name: Relocated optional Qt transport consumers
        run: |
          python3 -B tests/qt_transport/run.py --build-dir "$RUNNER_TEMP/qt-transport-packages" \
            --cobs-root "$GITHUB_WORKSPACE/build/dependencies/cobs" --qt-prefix "$QT_ROOT_DIR" \
            --cxx /usr/bin/g++ --cmake cmake --ninja ninja
      - name: Sanitized installed TCP and Qt ReadMany session
        run: |
          python3 -B tests/qt_read_many/run.py --build-dir "$RUNNER_TEMP/qt-read-many" \
            --qt-prefix "$QT_ROOT_DIR" --cxx /usr/bin/clang++-18 --sanitize --cmake cmake --ninja ninja
      - name: Sanitized installed TCP and Qt Mixed Batch session
        run: |
          python3 -B tests/qt_batch/run.py --build-dir "$RUNNER_TEMP/qt-batch" \
            --qt-prefix "$QT_ROOT_DIR" --cxx /usr/bin/clang++-18 --sanitize --cmake cmake --ninja ninja
      - name: Sanitized installed device files over the session queue
        run: |
          python3 -B tests/device_files/run.py --build-dir "$RUNNER_TEMP/device-files" \
            --qt-prefix "$QT_ROOT_DIR" --cxx /usr/bin/clang++-18 --sanitize --cmake cmake --ninja ninja
      - name: Sanitized installed link transport against its golden trace
        run: |
          python3 -B tests/link_transport/run.py --build-dir "$RUNNER_TEMP/link-transport" \
            --qt-prefix "$QT_ROOT_DIR" --cxx /usr/bin/clang++-18 --sanitize --cmake cmake --ninja ninja
      - name: Install the current SDK for cross-repository Qt consumers
        run: |
          cmake -S . -B "$RUNNER_TEMP/ux-sdk-build" -G Ninja \
            '-DTELEMETRY_COMPONENTS=inspector;workbench;read_many_workbench;encoded_backend;encoded_server;core;tcp_server;qt_serial_transport;qt_connection;resource_adapter;rpc_backend;rpc_sessions' \
            -DCOBS_ROOT="$GITHUB_WORKSPACE/build/dependencies/cobs" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=/usr/bin/clang++-18 \
            '-DCMAKE_CXX_FLAGS_RELEASE=-O1 -g -DNDEBUG -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer' \
            -DTELEMETRY_SOURCE_REVISION="$(git rev-parse HEAD)" \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/ux-sdk-prefix"
          cmake --build "$RUNNER_TEMP/ux-sdk-build" --target install --parallel 2
      - name: Installed SDK and Python wheels through the pinned UX QML consumer
        run: |
          python3 -B .ci/telemetry-ux/tests/codegen_qml/run.py --build-dir "$RUNNER_TEMP/codegen-qml" \
            --sdk-prefix "$RUNNER_TEMP/ux-sdk-prefix" \
            --codegen-python "$RUNNER_TEMP/ux-generator-tools/bin/python" \
            --qt-prefix "$QT_ROOT_DIR" --cxx /usr/bin/clang++-18 --sanitize --cmake /usr/bin/cmake --ninja /usr/bin/ninja
      - name: Sanitized serial discovery and fault injection through real PTYs
        run: |
          python3 -B tests/inspector_serial/run.py --build-dir "$RUNNER_TEMP/inspector-serial" \
            --ux-root "$GITHUB_WORKSPACE/.ci/telemetry-ux" --sdk-prefix "$RUNNER_TEMP/ux-sdk-prefix" \
            --cobs-root "$GITHUB_WORKSPACE/build/dependencies/cobs" --qt-prefix "$QT_ROOT_DIR" \
            --cxx /usr/bin/clang++-18 --sanitize --cmake /usr/bin/cmake --ninja /usr/bin/ninja
      - name: Sanitized Nucleo dispatch and physical TX ownership gate
        run: |
          python3 -B examples/nucleo_h7s3l8/tests/run.py --build-dir "$RUNNER_TEMP/nucleo-host" \
            --cobs-root "$GITHUB_WORKSPACE/build/dependencies/cobs" --cxx /usr/bin/clang++-18 \
            --sanitize --cmake /usr/bin/cmake --ninja /usr/bin/ninja
      - name: Sanitized ReadMany UART discovery and real CLI through PTYs
        run: |
          python3 -B tests/read_many_serial/run.py --build-dir "$RUNNER_TEMP/read-many-serial" \
            --cobs-root "$GITHUB_WORKSPACE/build/dependencies/cobs" --qt-prefix "$QT_ROOT_DIR" \
            --cxx clang++-18 --sanitize --cmake cmake --ninja ninja
      - name: Compare installed read paths and actual framed traffic
        run: |
          python3 -B tests/read_comparison/run.py --build-dir "$RUNNER_TEMP/read-comparison-gcc" \
            --cobs-root "$GITHUB_WORKSPACE/build/dependencies/cobs" --cxx /usr/bin/g++ \
            --cmake /usr/bin/cmake --ninja /usr/bin/ninja
          python3 -B tests/read_comparison/run.py --build-dir "$RUNNER_TEMP/read-comparison-sanitized" \
            --cobs-root "$GITHUB_WORKSPACE/build/dependencies/cobs" --cxx /usr/bin/clang++-18 \
            --sanitize --cmake /usr/bin/cmake --ninja /usr/bin/ninja
      - name: Qualify experimental bounded ReadMany mappings
        run: |
          python3 -B tests/read_many_mapping/run.py --build-dir "$RUNNER_TEMP/read-many-mapping-gcc" \
            --cobs-root "$GITHUB_WORKSPACE/build/dependencies/cobs" --cxx /usr/bin/g++ \
            --cmake /usr/bin/cmake --ninja /usr/bin/ninja
          python3 -B tests/read_many_mapping/run.py --build-dir "$RUNNER_TEMP/read-many-mapping-sanitized" \
            --cobs-root "$GITHUB_WORKSPACE/build/dependencies/cobs" --cxx /usr/bin/clang++-18 \
            --sanitize --cmake /usr/bin/cmake --ninja /usr/bin/ninja
      - name: Retain source, tool, build and runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-qml-sdk
          path: |
            ${{ runner.temp }}/codegen-qml/
            ${{ runner.temp }}/ux-generator-wheels/
            ${{ runner.temp }}/ux-sdk-prefix/share/telemetry/SDKMetadata.json
            ${{ runner.temp }}/inspector-serial/
            ${{ runner.temp }}/qt-transport-packages/
            ${{ runner.temp }}/qt-read-many/
            ${{ runner.temp }}/qt-batch/
            ${{ runner.temp }}/nucleo-host/
            ${{ runner.temp }}/read-many-serial/
            ${{ runner.temp }}/read-comparison-gcc/
            ${{ runner.temp }}/read-comparison-sanitized/
            ${{ runner.temp }}/read-many-mapping-gcc/
            ${{ runner.temp }}/read-many-mapping-sanitized/
          if-no-files-found: error

  qt:
    name: Qt module selections
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Bound host package downloads
        uses: ./.github/actions/setup-apt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the project's Qt
        uses: ./.github/actions/setup-qt
      - name: Independent resource qmake configurations
        run: python3 tests/structured/resources/run_qmake.py --qmake qmake --build-dir build/resource-qmake
      - name: Optional ReadMany qmake selections and include ordering
        run: python3 -B tests/read_many/qmake.py --qmake qmake --build-dir "$RUNNER_TEMP/read-many-qmake"
      - name: Optional Mixed Batch qmake selections and include ordering
        run: python3 -B tests/batch/qmake.py --qmake qmake --build-dir "$RUNNER_TEMP/mixed-batch-qmake"
      - name: Retain independent qmake selection manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resource-qmake-selections
          path: |
            build/resource-qmake/
            ${{ runner.temp }}/read-many-qmake/
            ${{ runner.temp }}/mixed-batch-qmake/
          if-no-files-found: error
      - name: Explicit structured protocol example qmake
        run: |
          mkdir -p build/example-qmake
          cd build/example-qmake
          qmake ../../tests/structured/exchange/qmake.pro CONFIG+=release QMAKE_CXXFLAGS+=-Werror QMAKE_CXXFLAGS+=-UNDEBUG
          make -j2
          ./structured_protocol_example
      - name: Structured client Qt C++20 smoke
        run: |
          mkdir -p build/client-qt
          cd build/client-qt
          qmake ../../examples/structured_client/qt.pro CONFIG+=release QMAKE_CXXFLAGS+=-Werror
          make -j2
          ./structured_client_qt
      - name: Structured-only multi-TU qmake consumer
        run: |
          mkdir -p build/qualification-qt
          cd build/qualification-qt
          qmake ../../tests/structured/qualification/qmake.pro CONFIG+=release QMAKE_CXXFLAGS+=-Werror
          make -j2
          ./structured_qualification
          if grep -E 'TelemetryJson.cpp|resource/telemetry/(Schema|Commands|Values)File.cpp|structured_protocol/(Bind|Exchange).cpp' Makefile; then exit 1; fi
