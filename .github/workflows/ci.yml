      - name: Flat native Cortex-M7 profiles and final response storage
        run: python3 tests/ergonomics/flat.py --arm --cxx arm-none-eabi-g++ --build-dir build/arm-flat-native
      - name: C++20 structured descriptor Cortex-M7 checks
        run: |
          python3 tests/structured/descriptor/run.py --arm --cxx arm-none-eabi-g++ --build-dir build/arm-structured-descriptor
          python3 tests/structured/descriptor/run.py --arm --null-checks --cxx arm-none-eabi-g++ --build-dir build/arm-structured-descriptor-nullchecks
      - name: C++20 structured resource Cortex-M7 checks
        run: python3 tests/structured/resources/run.py --arm --cxx arm-none-eabi-g++ --build-dir build/arm-structured-resources
      - name: C++20 RPC mailbox Cortex-M7 qualification
        run: |
          python3 tests/structured/rpc/run.py --arm --cxx arm-none-eabi-g++ --build-dir build/arm-structured-rpc
          python3 tests/structured/rpc/run.py --arm --null-checks --cxx arm-none-eabi-g++ --build-dir build/arm-structured-rpc-nullchecks
      - name: Retain RPC mailbox ARM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpc-cortex-m7
          path: |
            build/arm-structured-rpc/
            build/arm-structured-rpc-nullchecks/
