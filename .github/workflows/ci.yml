# Qualify native contracts, canonical wire bytes, examples and offline ARM codegen.
# Hardware receipts retain their measured source identity; CI never flashes a board.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  modules:
    name: Independent installed modules (${{ matrix.cxx }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++-18]
    steps:
      - uses: actions/checkout@v4
      - name: Bound host package downloads
        uses: ./.github/actions/setup-apt
      - name: Install host and offline ARM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 cmake ninja-build gcc-arm-none-eabi \
            binutils-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
      - name: Sealed headers, relocation, negative compilation and linking
        shell: bash
        run: |
          options=()
          if [[ '${{ matrix.cxx }}' == 'clang++-18' ]]; then options+=(--sanitize); fi
          python3 -B tests/modules/run.py --cxx '${{ matrix.cxx }}' \
            --build-dir "$RUNNER_TEMP/modules" "${options[@]}"
          python3 -B tests/encoded_dispatch/run.py --cxx '${{ matrix.cxx }}' \
            --build-dir "$RUNNER_TEMP/encoded-core" "${options[@]}"
          python3 -B tests/descriptor_core/run.py --cxx '${{ matrix.cxx }}' \
            --build-dir "$RUNNER_TEMP/descriptor-core" "${options[@]}"
          python3 -B tests/runtime_schema/run.py --cxx '${{ matrix.cxx }}' \
            --build-dir "$RUNNER_TEMP/runtime-schema" "${options[@]}"
          dynamic_options=()
          if [[ '${{ matrix.cxx }}' == 'g++' ]]; then dynamic_options+=(--arm-cxx arm-none-eabi-g++); fi
          python3 -B tests/dynamic_client/run.py --cxx '${{ matrix.cxx }}' \
            --build-dir "$RUNNER_TEMP/dynamic-client" "${options[@]}" "${dynamic_options[@]}"
          python3 -B tests/inspector/run.py --cxx '${{ matrix.cxx }}' \
            --build-dir "$RUNNER_TEMP/inspector" "${options[@]}" "${dynamic_options[@]}"
          python3 -B tests/tcp_stream/run.py --cxx '${{ matrix.cxx }}' \
            --build-dir "$RUNNER_TEMP/tcp-stream" "${options[@]}" "${dynamic_options[@]}"
          python3 -B tests/client_module/run.py --cxx '${{ matrix.cxx }}' \
            --build-dir "$RUNNER_TEMP/client-module"
          python3 -B tests/read_many/run.py --cxx '${{ matrix.cxx }}' \
            --build-dir "$RUNNER_TEMP/read-many" "${options[@]}"
          python3 -B tests/read_many_static/run.py --cxx '${{ matrix.cxx }}' \
            --build-dir "$RUNNER_TEMP/read-many-static" "${options[@]}"
          python3 -B tests/batch/run.py --cxx '${{ matrix.cxx }}' \
            --build-dir "$RUNNER_TEMP/mixed-batch" "${options[@]}"
          python3 -B tests/batch_static/run.py --cxx '${{ matrix.cxx }}' \
            --build-dir "$RUNNER_TEMP/mixed-batch-static" "${options[@]}"
      - name: Installed Cortex-M7 modules compile and link
        if: matrix.cxx == 'g++'
        run: |
          python3 -B tests/modules/run.py --arm --cxx arm-none-eabi-g++ --build-dir "$RUNNER_TEMP/modules-arm"
          python3 -B tests/read_many/run.py --arm --cxx arm-none-eabi-g++ --build-dir "$RUNNER_TEMP/read-many-arm"
          python3 -B tests/read_many_static/run.py --arm --cxx arm-none-eabi-g++ --build-dir "$RUNNER_TEMP/read-many-static-arm"
          python3 -B tests/batch/run.py --arm --cxx arm-none-eabi-g++ --build-dir "$RUNNER_TEMP/mixed-batch-arm"
          python3 -B tests/batch_static/run.py --arm --cxx arm-none-eabi-g++ --build-dir "$RUNNER_TEMP/mixed-batch-static-arm"
      - name: Retain module qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modules-${{ matrix.cxx }}
          path: |
            ${{ runner.temp }}/modules/
            ${{ runner.temp }}/modules-arm/
            ${{ runner.temp }}/encoded-core/
            ${{ runner.temp }}/descriptor-core/
            ${{ runner.temp }}/runtime-schema/
            ${{ runner.temp }}/dynamic-client/
            ${{ runner.temp }}/inspector/
            ${{ runner.temp }}/tcp-stream/
            ${{ runner.temp }}/client-module/
            ${{ runner.temp }}/read-many/
            ${{ runner.temp }}/read-many-arm/
            ${{ runner.temp }}/read-many-static/
            ${{ runner.temp }}/read-many-static-arm/
            ${{ runner.temp }}/mixed-batch/
            ${{ runner.temp }}/mixed-batch-arm/
            ${{ runner.temp }}/mixed-batch-static/
            ${{ runner.temp }}/mixed-batch-static-arm/
          if-no-files-found: error

  modules-windows:
    name: Windows installed client and junction containment
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve canonical source bytes in this runner checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require the native Windows toolchain
        run: |
          $python = (Get-Command python.exe -CommandType Application -ErrorAction Stop).Source
          $tools = [ordered]@{
            cxx = 'C:\mingw64\bin\g++.exe'
            cmake = (Get-Command cmake.exe -CommandType Application -ErrorAction Stop).Source
            ninja = (Get-Command ninja.exe -CommandType Application -ErrorAction Stop).Source
          }
          $output = Join-Path $env:RUNNER_TEMP 'modules-windows'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          foreach ($tool in $tools.GetEnumerator()) {
            if (!(Test-Path -LiteralPath $tool.Value -PathType Leaf)) {
              throw "Required native tool is missing: $($tool.Value)"
            }
            if ($tool.Value -match '(?i)\\(msys64|msys32)\\|\\Git\\usr\\') {
              throw "An MSYS tool cannot qualify native Windows paths: $($tool.Value)"
            }
            $version = & $tool.Value --version 2>&1
            if ($LASTEXITCODE -ne 0) { throw "$($tool.Key) --version failed" }
            "$($tool.Key): $($tool.Value)" | Add-Content -LiteralPath "$output/toolchain.log"
            $version | Tee-Object -FilePath "$output/toolchain.log" -Append
            (Get-FileHash -LiteralPath $tool.Value -Algorithm SHA256).Hash |
              Add-Content -LiteralPath "$output/toolchain.log"
            (Split-Path -Parent $tool.Value) | Add-Content -LiteralPath $env:GITHUB_PATH
          }
          "TELEMETRY_WINDOWS_CXX=$($tools.cxx)" | Add-Content -LiteralPath $env:GITHUB_ENV
          "TELEMETRY_WINDOWS_CMAKE=$($tools.cmake)" | Add-Content -LiteralPath $env:GITHUB_ENV
          "TELEMETRY_WINDOWS_PYTHON=$python" | Add-Content -LiteralPath $env:GITHUB_ENV
          "python: $python" | Add-Content -LiteralPath "$output/toolchain.log"
          (Split-Path -Parent $tools.cxx) | Add-Content -LiteralPath $env:GITHUB_PATH
          & $python -c "import sys; assert sys.version_info[:2] == (3, 12); print(sys.version)"
          if ($LASTEXITCODE -ne 0) { throw 'Python 3.12 is required' }
      - name: Installed client and mandatory Windows junction controls
        run: |
          & $env:TELEMETRY_WINDOWS_PYTHON -B tests/modules/run.py --modules client --cxx "$env:TELEMETRY_WINDOWS_CXX" `
            --cmake "$env:TELEMETRY_WINDOWS_CMAKE" --build-dir "$env:RUNNER_TEMP/modules-windows"
          if ($LASTEXITCODE -ne 0) { throw 'Windows module qualification failed' }
      - name: Offline Nucleo hardware-runner failure and restoration controls
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass `
            -File tests/nucleo_h7s3l8/CheckRunner.ps1 `
            -ExternalOutput "$env:RUNNER_TEMP/nucleo-runner-controls"
          if ($LASTEXITCODE -ne 0) { throw 'Offline hardware-runner controls failed' }
      - name: Collect flat evidence without following fixture junctions
        if: always()
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'modules-windows'
          $evidence = Join-Path $env:RUNNER_TEMP 'modules-windows-evidence'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          if (Test-Path -LiteralPath $output -PathType Container) {
            Get-ChildItem -LiteralPath $output -File | Where-Object {
              $_.Name -eq 'summary.json' -or $_.Extension -eq '.log'
            } | ForEach-Object {
              if ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) {
                throw "Evidence must be a regular file: $($_.FullName)"
              }
              Copy-Item -LiteralPath $_.FullName -Destination $evidence
            }
          }
      - name: Retain Windows module qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modules-windows
          path: |
            ${{ runner.temp }}/modules-windows-evidence/
            ${{ runner.temp }}/nucleo-runner-controls/
          if-no-files-found: error

  async-client:
    name: Portable async client (${{ matrix.cxx }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++-18]
    steps:
      - uses: actions/checkout@v4
      - name: Bound host package downloads
        uses: ./.github/actions/setup-apt
      - name: Install selected host and bare-metal compilers
        shell: bash
        run: |
          packages=(clang-18)
          if [[ '${{ matrix.cxx }}' == 'g++' ]]; then
            # ARM probes compile objects; only C++ headers and newlib are needed.
            packages=(gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-dev)
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
      - name: Core, noheap, real backends and unchanged bare-metal loop
        shell: bash
        run: |
          options=()
          if [[ '${{ matrix.cxx }}' == 'g++' ]]; then
            options+=(--arm-cxx arm-none-eabi-g++)
          else
            options+=(--sanitize)
          fi
          python3 -B tests/async_client/run.py --cxx '${{ matrix.cxx }}' \
            --build-dir "$RUNNER_TEMP/async-client" "${options[@]}"
          python3 -B tests/async_client/Encoded_run.py --cxx '${{ matrix.cxx }}' \
            --no-heap --build-dir "$RUNNER_TEMP/async-encoded"
      - name: DMA buffer lifetime, RPC recovery and HAL callback ordering
        shell: bash
        run: |
          options=()
          if [[ '${{ matrix.cxx }}' == 'g++' ]]; then
            options+=(--arm-cxx arm-none-eabi-g++)
          else
            options+=(--sanitize)
          fi
          python3 -B tests/transport_dma/run.py --cxx '${{ matrix.cxx }}' \
            --build-dir "$RUNNER_TEMP/transport-dma" "${options[@]}"
      - name: Retain portable client evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: async-client-${{ matrix.cxx }}
          path: |
            ${{ runner.temp }}/async-client/
            ${{ runner.temp }}/async-encoded/
            ${{ runner.temp }}/transport-dma/
          if-no-files-found: error

  async-client-tsan:
    name: MPSC ThreadSanitizer (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TSAN_OPTIONS: halt_on_error=1:exitcode=66
    steps:
      - uses: actions/checkout@v4
      - name: Bound host package downloads
        uses: ./.github/actions/setup-apt
      - name: Install Clang and its sanitizer runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 libclang-rt-18-dev binutils
      - name: Core queue and MPSC publication, cancellation and close/drain
        run: |
          python3 -B tests/async_client/run.py --cxx clang++-18 --thread-sanitize \
            --build-dir "$RUNNER_TEMP/async-client-tsan"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          directory = Path(os.environ['RUNNER_TEMP']) / 'async-client-tsan'
          report = json.loads((directory / 'summary.json').read_text())
          assert report['passed'] and report['checks'].get('core', 0) >= 115
          assert report['compile_contracts'] == {'positive': 1, 'expected_rejections': 7}
          symbols = subprocess.check_output(['nm', str(directory / 'core')], text=True)
          assert '__tsan_init' in symbols and '__tsan_write4' in symbols
          PY
      - name: Retain ThreadSanitizer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: async-client-tsan
          path: ${{ runner.temp }}/async-client-tsan/
          if-no-files-found: error

  async-client-web:
    name: Shared C++ JS TS async contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Bound host package downloads
        uses: ./.github/actions/setup-apt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install native sanitizer tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-18 libclang-rt-18-dev
      - name: Install the pinned TypeScript compiler
        run: npm install --prefix "$RUNNER_TEMP/async-tools" typescript@5.9.3 --no-audit --no-fund
      - name: Strict TS, emitted JS, shared traces and real Encoded/RPC servers
        run: |
          python3 -B tests/client_web/run.py --node node \
            --tsc "$RUNNER_TEMP/async-tools/node_modules/typescript/bin/tsc" \
            --build-dir "$RUNNER_TEMP/async-client-web"
      - name: ReadMany inferred tuples and native Encoded interoperability
        run: |
          python3 -B tests/client_read_many_web/run.py --node node \
            --tsc "$RUNNER_TEMP/async-tools/node_modules/typescript/bin/tsc" \
            --cxx g++ --build-dir "$RUNNER_TEMP/read-many-web"
      - name: Sanitized native ReadMany interoperability
        run: |
          python3 -B tests/client_read_many_web/run.py --node node \
            --tsc "$RUNNER_TEMP/async-tools/node_modules/typescript/bin/tsc" \
            --cxx clang++-18 --sanitize --build-dir "$RUNNER_TEMP/read-many-web-sanitized"
      - name: Mixed Batch inferred tuples and native Encoded interoperability
        run: |
          python3 -B tests/client_batch_web/run.py --node node \
            --tsc "$RUNNER_TEMP/async-tools/node_modules/typescript/bin/tsc" \
            --cxx g++ --build-dir "$RUNNER_TEMP/batch-web"
      - name: Sanitized native Mixed Batch interoperability
        run: |
          python3 -B tests/client_batch_web/run.py --node node \
            --tsc "$RUNNER_TEMP/async-tools/node_modules/typescript/bin/tsc" \
            --cxx clang++-18 --sanitize --build-dir "$RUNNER_TEMP/batch-web-sanitized"
      - name: Dynamic Descriptor client and six-operation native parity
        run: |
          python3 -B tests/client_dynamic_web/run.py --node node \
            --tsc "$RUNNER_TEMP/async-tools/node_modules/typescript/bin/tsc" \
            --cxx g++ --build-dir "$RUNNER_TEMP/dynamic-web"
      - name: Sanitized dynamic Descriptor client interoperability
        run: |
          python3 -B tests/client_dynamic_web/run.py --node node \
            --tsc "$RUNNER_TEMP/async-tools/node_modules/typescript/bin/tsc" \
            --cxx clang++-18 --sanitize --build-dir "$RUNNER_TEMP/dynamic-web-sanitized"
      - name: Installed connection facade and deterministic ownership contracts
        run: |
          python3 -B tests/connection_session/run.py --node node \
            --tsc "$RUNNER_TEMP/async-tools/node_modules/typescript/bin/tsc" \
            --cxx g++ --build-dir "$RUNNER_TEMP/connection-session"
      - name: Sanitized native connection facade interoperability
        run: |
          python3 -B tests/connection_session/run.py --node node \
            --tsc "$RUNNER_TEMP/async-tools/node_modules/typescript/bin/tsc" \
            --cxx clang++-18 --sanitize --build-dir "$RUNNER_TEMP/connection-session-sanitized"
      - name: Retain cross-language evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: async-client-web
          path: |
            ${{ runner.temp }}/async-client-web/
            ${{ runner.temp }}/read-many-web/
            ${{ runner.temp }}/read-many-web-sanitized/
            ${{ runner.temp }}/batch-web/
            ${{ runner.temp }}/batch-web-sanitized/
            ${{ runner.temp }}/dynamic-web/
            ${{ runner.temp }}/dynamic-web-sanitized/
            ${{ runner.temp }}/connection-session/
            ${{ runner.temp }}/connection-session-sanitized/
          if-no-files-found: error

  source-style:
    name: Source comments, guards and pinned formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact formatter version
        run: |
          python3 -m venv build/source-style-venv
          build/source-style-venv/bin/python -m pip --disable-pip-version-check install clang-format==22.1.8
      - name: Verify authored sources without rewriting them
        run: |
          python3 tools/source_style/check.py --clang-format build/source-style-venv/bin/clang-format --self-test
      - name: Verify Markdown files and local heading navigation
        run: python3 tools/documentation_navigation/check.py --self-test
      - name: Verify retained UART Inspector hardware evidence and negative controls
        run: python3 -B tests/nucleo_h7s3l8/VerifyEvidence.py --self-test
      - name: Verify retained ReadMany UART report and negative controls
        run: |
          python3 -B tests/nucleo_h7s3l8/VerifyReadManyEvidence.py \
            --report doc/evidence/read-many-uart-2026-11-01/report.json --port COM6 --self-test
      - name: Verify retained audit hardware receipt controls
        run: |
          python3 tests/structured/mcu/h7s/verify.py --receipt doc/evidence/audit-2026-10-11/h7s-mcu-receipt.json --self-test --allow-stale-inputs
          python3 tests/structured/resources/h7s/verify.py --receipt doc/evidence/audit-2026-10-11/h7s-resources-receipt.json --self-test
      - name: Verify retained RPC UART receipt and controls
        run: python3 tests/structured/rpc/h7s/verify.py --receipt tests/structured/rpc/h7s/receipt.json --self-test

  scalability:
    name: Bounded catalogs, type graphs and module integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Bound host package downloads
        uses: ./.github/actions/setup-apt
      - name: Install measurement tools
        run: sudo apt-get update && sudo apt-get install -y clang-18 time binutils
      - name: Checkout immutable positional-root baseline
        uses: actions/checkout@v4
        with:
          ref: 34cf1599614fe475b0823f7a0acfb6ee3aeff8f9
          path: build/root-baseline
      - name: Preserve positional roots and exact descriptor/value bytes
        run: |
          python3 tests/scalability/root_types/run.py --cxx g++ \
            --source-root build/root-baseline \
            --build-dir "$RUNNER_TEMP/scalability/root-before"
          python3 tests/scalability/root_types/run.py --cxx g++ --expect-new \
            --before-dir "$RUNNER_TEMP/scalability/root-before" \
            --build-dir "$RUNNER_TEMP/scalability/root-after-gcc"
          python3 tests/scalability/root_types/run.py --cxx clang++-18 --sanitize --expect-new \
            --before-dir "$RUNNER_TEMP/scalability/root-before" \
            --build-dir "$RUNNER_TEMP/scalability/root-after-sanitized"
      - name: Require successful repeated-type Model profiles
        run: |
          for compiler in g++ clang++-18; do
            python3 tests/scalability/compile_tables.py --cxx "$compiler" \
              --build-dir "$RUNNER_TEMP/scalability/tables-$compiler" \
              --rows 32 128 --families field command service mixed \
              --layouts sharded --stages model --require-pass \
              --isolation-note "Sequential profiles in a dedicated CI worker"
          done
      - name: Require default-budget 1024 and 2048 repeated fields and Mixed256
        run: |
          for compiler in g++ clang++-18; do
            python3 tests/scalability/compile_tables.py --cxx "$compiler" \
              --build-dir "$RUNNER_TEMP/scalability/repeated-roots-$compiler" \
              --rows 1024 2048 --families field --layouts sharded \
              --stages model --require-pass \
              --isolation-note "Sequential root-reduction regression; default compiler budgets"
            python3 tests/scalability/compile_tables.py --cxx "$compiler" \
              --build-dir "$RUNNER_TEMP/scalability/mixed-roots-$compiler" \
              --rows 256 --families mixed --layouts sharded \
              --stages model --require-pass \
              --isolation-note "Mixed256 per family; default compiler budgets"
          done
      - name: Require successful shared and distinct type graphs
        run: |
          python3 tests/scalability/compile_types.py --baseline "$GITHUB_SHA" \
            --build-dir "$RUNNER_TEMP/scalability/types" --counts 32 128 \
            --compilers g++ clang++-18 --layers registry model --backend-boundaries --require-pass
      - name: Validate runtime indexes and actual descriptor/value files
        run: |
          python3 tests/scalability/runtime.py --cxx g++ \
            --build-dir "$RUNNER_TEMP/scalability/runtime"
          python3 tests/scalability/runtime.py --cxx clang++-18 --sanitize \
            --build-dir "$RUNNER_TEMP/scalability/runtime-sanitized"
          python3 tests/scalability/runtime.py --cxx clang++-18 --sanitize --resources \
            --build-dir "$RUNNER_TEMP/scalability/resources-sanitized"
      - name: Validate visitor types and independent module consumers
        run: |
          python3 tests/scalability/visitors.py --cxx g++ --rows 128 \
            --build-dir "$RUNNER_TEMP/scalability/visitors"
          python3 tests/scalability/modular.py --cxx g++ \
            --build-dir "$RUNNER_TEMP/scalability/modular"
      - name: Retain profiles and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scalability
          path: ${{ runner.temp }}/scalability/
          if-no-files-found: error

  checks:
    name: ${{ matrix.cxx }} ${{ matrix.standard }} ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++-18]
        standard: [c++20]
        mode: [release]
        include:
          - {cxx: clang++-18, standard: c++20, mode: sanitized}
          - {cxx: g++, standard: c++20, mode: nullchecks}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Authenticate sealed hardware and recorded-source Git snapshots.
      - name: Bound host package downloads
        uses: ./.github/actions/setup-apt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: File comments and dual include guards
        run: python3 tools/source_style/check.py
      - uses: actions/checkout@v4
        with:
          repository: shpegun60/cobs
          ref: 2e0abf260848fcb74e4a57b37532188047759643
          path: build/dependencies/cobs
      - name: Real COBS telemetry and resource integration
        env:
          CXX: ${{ matrix.cxx }}
          MODE: ${{ matrix.mode }}
        run: |
          flags=()
          if [ "$MODE" = sanitized ]; then flags+=(--sanitize); fi
          python3 tests/cobs/run.py --cobs-root build/dependencies/cobs --build-dir build/cobs "${flags[@]}"
      - name: Retain COBS integration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobs-${{ matrix.cxx }}-${{ matrix.mode }}
          path: build/cobs/
          if-no-files-found: error
      - name: Install Clang LTO linker
        if: matrix.cxx == 'clang++-18'
        run: sudo apt-get update && sudo apt-get install -y lld
      - name: Shared ID, slot and numeric contracts
        env:
          CXX: ${{ matrix.cxx }}
          STANDARD: ${{ matrix.standard }}
          MODE: ${{ matrix.mode }}
        run: |
          flags=()
          if [ "$MODE" = sanitized ]; then flags+=(--sanitize); fi
          if [ "$MODE" = nullchecks ]; then flags+=(--null-checks); fi
          python3 tests/run_checks.py --std "$STANDARD" --build-dir build/checks "${flags[@]}"
      - name: Retain shared contract logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-${{ matrix.cxx }}-${{ matrix.standard }}-${{ matrix.mode }}
          path: |
            build/checks/*.log
            build/checks/summary.json
          if-no-files-found: error
      - name: C++20 resource libraries
